name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: https://fan-guide.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      # tests/unit/official-embed.test.ts drives the custom element in a real browser.
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:core
      - run: npx wrangler deploy --dry-run
