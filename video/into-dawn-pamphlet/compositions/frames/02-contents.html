  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var q = function (s) { return document.querySelector('[data-composition-id="02-contents"] ' + s); };
      var kicker = q(".c02-contents-kicker");
      var title = q(".c02-contents-title");
      var count = q(".c02-contents-count");
      var countCol = q(".c02-contents-count-col");
      var sheet = q(".c02-contents-sheet");
      var track = q(".c02-contents-rail-track");
      var bar = q(".c02-contents-bar");
      var edge = q(".c02-contents-card-edge");
      var b1 = q(".c02-contents-band-1");
      var b2 = q(".c02-contents-band-2");
      var b3 = q(".c02-contents-band-3");

      var Y0 = -123.8;      // screen cropped just below its own 차례 row
      var YEND = -591.8;  // bottom of the screen meets the card bottom
      var BAR = [171.5, 744.7, 1200.3]; // bar tops beside each chapter label (sheet coords)

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-0.4): kicker + headline rise at upper-left
      tl.fromTo(kicker, { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0);
      tl.fromTo(title, { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.34, ease: "power3.out" }, 0.06);

      // Scene 2 (0.4-0.9): contents screen slides up into the masked card like a sheet of paper
      tl.fromTo(edge, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 0.4);
      tl.fromTo([sheet, track], { y: Y0 + 560 }, { y: Y0, duration: 0.5, ease: "power3.out" }, 0.4);
      tl.fromTo(sheet, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.4);
      tl.fromTo(bar, { y: BAR[0], opacity: 0, scaleY: 0.2 }, { y: BAR[0], opacity: 1, scaleY: 1, duration: 0.2, ease: "power2.out" }, 0.7);
      tl.fromTo(b1, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 0.72);
      tl.fromTo(count, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 0.7);

      // Scene 3 (0.9-2.0): screen pans up; bar steps 01 -> 02 -> 03 as each label crosses, then holds
      tl.fromTo([sheet, track], { y: Y0 }, { y: YEND, duration: 0.7, ease: "power2.inOut", immediateRender: false }, 0.9);

      tl.to(countCol, { y: -80, duration: 0.16, ease: "power3.inOut" }, 1.02);

      tl.to(bar, { y: BAR[2], duration: 0.16, ease: "power3.inOut" }, 1.42);
      tl.to(b2, { opacity: 0, duration: 0.14, ease: "power1.in" }, 1.42);
      tl.fromTo(b3, { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out" }, 1.48);
      tl.to(countCol, { y: -160, duration: 0.16, ease: "power3.inOut" }, 1.42);
