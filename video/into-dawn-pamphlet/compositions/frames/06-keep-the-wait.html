    <script>
      (function () {
        var q = function (name) {
          return document.querySelector('[id="06-keep-the-wait-' + name + '"]');
        };
        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0–0.5s): gold numeral settles in from the right (leftward, matching the page turn).
        tl.fromTo(
          q("num"),
          { x: 140, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
          0
        );

        // Scene 2 (0.5–0.8s): chapter title rises, then the muted sub-line.
        tl.fromTo(
          q("title"),
          { y: 40, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
          0.4
        );
        tl.fromTo(
          q("sub"),
          { y: 40, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" },
          0.65
        );

        // Scene 3 (0.8–1.5s): the ONE move — the ticket slides in from the lower right
        // and settles at -6deg, like a ticket tucked between pamphlet pages.
        tl.fromTo(
          q("ticket"),
          { x: 520, y: 260, rotation: -11, opacity: 0 },
          { x: 0, y: 0, rotation: -6, opacity: 1, duration: 0.65, ease: "power3.out" },
          0.85
        );
        // Scene 4 (1.5–2.2s): held read — nothing moves.
        tl.to({}, { duration: 0.7 }, 1.5);
