  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="05-road-to-dawn"]');
      var q = function (s) { return root.querySelector(s); };
      var qa = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };
      var stage = q('[data-f05="stage"]');
      var num = q('[data-f05="num"]');
      var head = q('[data-f05="head"] [data-f05="line"] > span');
      var sub = q('[data-f05="sub"] [data-f05="line"] > span');
      var words = qa('[data-f05="route"] > span');
      var win = q('[data-f05="window"]');
      var rows = qa('[data-f05="row"]');

      var tl = gsap.timeline({ paused: true });

      // Macro: slow push-in under the whole shot
      tl.fromTo(stage, { scale: 1 }, { scale: 1.014, duration: 2.2, ease: "none" }, 0);

      // Scene 1 (0.0–0.5): gold "02" settles in from the right
      tl.fromTo(num, { x: 140, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 0);
      // empty list region established early (the array's slot)
      tl.fromTo(win, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.15);

      // Scene 2 (0.5–0.9): headline rises in its line mask, then the muted sub-line
      tl.fromTo(head, { yPercent: 105 }, { yPercent: 0, duration: 0.42, ease: "power3.out" }, 0.5);
      tl.fromTo(sub, { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.34, ease: "power3.out" }, 0.64);

      // Scene 3 (0.9–1.3): gold route line, word by word
      tl.fromTo(words, { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.24, ease: "power2.out", stagger: 0.028 }, 0.9);

      // Scene 4 (1.3–2.2): guide rows unmask top to bottom, then hold
      rows.forEach(function (row, i) {
        var at = 1.3 + i * 0.12;
