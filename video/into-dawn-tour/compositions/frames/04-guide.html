  <script>
    (function () {
      "use strict";
      var root = document.querySelector('[data-composition-id="04-guide"]');
      var cam = root.querySelector('[data-f04="cam"]');
      var shot = root.querySelector('[data-f04="shot"]');
      var words = root.querySelectorAll('[data-f04="line1"] [data-f04="word"]');
      var line2 = root.querySelector('[data-f04="line2"]');

      // Camera targets baked from the screenshot geometry (image-space
      // fractions, no font dependence). The 공식 공연 정보 block sits at
      // ~0.62-0.82 of the screen height.
      // In-slot scroll: scale 1.35 anchored bottom-left (5% 100%) lifts the
      // block from ~0.80 to ~0.76 and enlarges it while 콘서트 가이드 leaves the top.
      var SCROLL_SCALE = 1.35;

      var tl = gsap.timeline({ paused: true });

      // Seat state at t=0 (identical to frame 03's phone seat).
      tl.set(cam, { transformOrigin: "335px 930px", scale: 1, y: 0 }, 0);
      tl.set(shot, { transformOrigin: "5% 100%", scale: 1 }, 0);

      // Scene 1 (0.0-0.5): captions swap in.
      tl.fromTo(
        words,
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.38, ease: "power3.out", stagger: 0.045 },
        0,
      );
      tl.fromTo(
        line2,
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        0.22,
      );

      // Scene 2 (0.5-1.9): screen scrolls to 공식 공연 정보 while the phone
      // pushes in on that block, decelerating.
      tl.fromTo(
        shot,
        { scale: 1 },
        { scale: SCROLL_SCALE, duration: 1.4, ease: "power3.out", immediateRender: false },
        0.5,
      );
      // The phone itself stays in the shared seat (frames 01-05) so the cut
      // into 05-ticket doesn't show two phones of different sizes; only the
      // screen content zooms. Scene 3 (1.9-2.5): still read.

      tl.seek(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["04-guide"] = tl;
    })();
  </script>
