      .\30 3-setlist-ground {
        position: absolute;
        inset: 0;

      /* phone seat shared with frames 01-04: x 205, w 670, y 520 */
      .\30 3-setlist-stage {
        position: absolute;

        position: relative;

        aspect-ratio: 1170 / 2532;

        position: absolute;
        left: 0;

      .\30 3-setlist-page img {
        display: block;
        width: 100%;
        height: auto;
        -webkit-mask-image: linear-gradient(to bottom, #000 90%, transparent 100%);

    <script>
      (function () {
        var words = document.getElementById("03-setlist-caption").querySelectorAll("span");
        var badge = document.getElementById("03-setlist-badge");
        var page = document.getElementById("03-setlist-page");

        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0-0.5s): caption swaps in word by word (waterfall entry,
        // leftward, velocity-matched power4.out), badge settles under it and pins.
        tl.fromTo(
          words,
          { x: 150, opacity: 0.35 },
          { x: 0, opacity: 1, duration: 0.42, ease: "power4.out", stagger: 0.05 },
          0
        );
        tl.fromTo(
          badge,
          { y: -16, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" },
          0.2
        );

        // Scene 2 (0.5-1.9s): the page inside the phone scrolls from the top
        // (its own badge in view) down to the song list and the first song card,
        // decelerating into the stop.
        tl.fromTo(page, { y: 0 }, { y: -250, duration: 1.4, ease: "power3.out" }, 0.5);

        // Scene 3 (1.9-2.5s): held read; frame locks to the end.
        tl.set({}, {}, 2.5);

        window.__timelines = window.__timelines || {};
        window.__timelines["03-setlist"] = tl;
      })();
    </script>
