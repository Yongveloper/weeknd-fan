    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var root = document.getElementById("root");
        var phone = root.querySelector('[id="01-open-phone"]');
        var w1 = root.querySelector('[id="01-open-l1"]').querySelectorAll("[class~='01-open-w']");
        var w2 = root.querySelector('[id="01-open-l2"]').querySelectorAll("[class~='01-open-w']");
        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0–0.7s): phone rises from below into its fixed seat (lands exactly at y=0, scale 1).
        tl.fromTo(phone, { y: 520, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out", immediateRender: true }, 0);
        tl.fromTo(phone, { scale: 0.96 }, { scale: 1, duration: 0.7, ease: "power2.out", transformOrigin: "50% 30%", immediateRender: true }, 0);

        // Scene 2 (0.7–1.2s): line 1 rises, per-word stagger.
        tl.fromTo(w1, { y: 46, opacity: 0, filter: "blur(8px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power3.out", stagger: 0.05, immediateRender: true }, 0.7);

        // Scene 3 (1.2–1.8s): gold line rises under it.
        tl.fromTo(w2, { y: 46, opacity: 0, filter: "blur(8px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.46, ease: "power3.out", stagger: 0.06, immediateRender: true }, 1.2);

        // Scene 4 (1.8–2.5s): held read — the copy settles a hair, phone stays in seat.
        tl.fromTo(root.querySelector('[id="01-open-copy"]'), { y: 0 }, { y: -6, duration: 0.7, ease: "sine.out", immediateRender: false }, 1.8);

        window.__timelines = window.__timelines || {};
        window.__timelines["01-open"] = tl;
      })();
    </script>
